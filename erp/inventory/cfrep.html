<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuBase | C&F Export</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-page="inventory-cfrep">
    <div id="navbar"></div>
    <div class="app-layout">
        <aside id="sidebar"></aside>
        <main class="main-content">
            <section class="hero"><div class="hero-content"><p class="eyebrow">ERP KNOWLEDGE BASE</p><h1>C&F REPORT</h1><p class="hero-description">Dokumentasi laporan persediaan C&F Report.</p></div></section>
            <section class="section">
                <div class="section-heading"><i class="ph ph-file-text"></i><h2>Documentation</h2></div>
                <div class="documentation erp-editor" data-erp-editor>
                    <div class="erp-editor-toolbar" aria-label="Alat edit dokumentasi"><button type="button" data-command="bold"><strong>B</strong></button><button type="button" data-command="italic"><em>I</em></button><button type="button" data-command="insertUnorderedList">List</button><label class="erp-editor-file">Pilih gambar<input type="file" accept="image/*" data-image-file></label><input type="url" placeholder="Tempel URL gambar" data-image-url><button type="button" data-insert-image>Masukkan gambar</button><button type="button" data-reset-editor>Reset</button></div>
                    <article class="doc-block"><span class="doc-label">Inventory | C&F REPORT</span>
                        <div contenteditable="true" spellcheck="true">
                            <!-- <h3>Laporan CFREP</h3><p>CFREP digunakan sebagai laporan untuk meninjau informasi persediaan sesuai filter dan parameter yang tersedia di sistem. Tentukan rentang tanggal, lokasi, dan kelompok material agar hasil laporan konsisten.</p><h3>Pemeriksaan Hasil</h3><p>Cocokkan total laporan dengan transaksi penerimaan, issue, transfer, dan saldo pada periode yang sama. Simpan parameter laporan bersama hasilnya agar penelusuran dan rekonsiliasi dapat diulang.</p> -->
                        </div></article>
                    <p class="editor-status" data-editor-status aria-live="polite"></p>
                </div>
            </section>
        </main>
    </div>
    <script src="../../js/navbar.js"></script>
    <script src="../../js/erp-editor.js"></script>
</body>
</html>
