<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuBase | Stage Order</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body data-page="stage-order">

    <div id="navbar"></div>

    <div class="app-layout">
        <aside id="sidebar"></aside>

        <main class="main-content">
            <section class="hero">
                <div class="hero-content">
                    <p class="eyebrow">ERP KNOWLEDGE BASE</p>
                    <h1>Stage Order</h1>
                    <p class="hero-description">Stage order documentation.</p>
                </div>
            </section>

            <section class="section">
                <div class="section-heading">
                    <i class="ph ph-file-text"></i>
                    <h2>Documentation</h2>
                </div>

                <div class="documentation erp-editor" data-erp-editor>
                    <div class="erp-editor-toolbar" aria-label="Alat edit dokumentasi">
                        <button type="button" data-command="bold"><strong>B</strong></button>
                        <button type="button" data-command="italic"><em>I</em></button>
                        <button type="button" data-command="insertUnorderedList">List</button>
                        <label class="erp-editor-file">Pilih gambar<input type="file" accept="image/*" data-image-file></label>
                        <input type="url" placeholder="Tempel URL gambar" data-image-url>
                        <button type="button" data-insert-image>Masukkan gambar</button>
                        <button type="button" data-reset-editor>Reset</button>
                    </div>
                    <article class="doc-block">
                        <span class="doc-label">Stage | Order Detail</span>
                        <div contenteditable="true" spellcheck="true">
                            <!-- <p><strong>Order</strong> berisi pesanan buyer dan menjadi dasar untuk costing, MRP, purchase, produksi, packing, serta pengiriman. Setiap order memiliki nomor <strong>SPI (Surat Pesanan Internal)</strong>.</p>
                            <h3>Order Entry Detail</h3>
                            <p>Informasi order mencakup order number, buyer, order date, order quantity, ship date, dan detail lain. Contoh SPI: <strong>2B/2026/HBI/1821</strong>; 2B adalah unit, 2026 tahun order, HBI buyer, dan 1821 nomor urut.</p>
                            <h3>Data Order</h3>
                            <ul><li><strong>Buyer PO:</strong> purchase order buyer yang menjadi referensi produk dan kebutuhan order.</li><li><strong>Assortment:</strong> pembagian order berdasarkan style, color, size, dan quantity.</li><li><strong>Destination:</strong> lokasi pengiriman; dapat berbeda dari lokasi buyer, misalnya buyer di Inggris dengan destination Brazil.</li><li><strong>Ship date:</strong> tanggal barang harus dikirim sesuai permintaan buyer.</li><li><strong>Style, Color, Size:</strong> identitas model dan variasi produk/material.</li></ul>
                            <h3>Hubungan ke MRP</h3>
                            <p>Order dan assortment menjadi acuan material requirement. BOM serta Raw Material Specifications menentukan material, article, color, size, position, dan consumption yang diperlukan untuk memenuhi quantity order.</p> -->
                        </div>
                    </article>
                    <p class="editor-status" data-editor-status aria-live="polite"></p>
                </div>
            </section>
        </main>
    </div>

    <script src="../../js/navbar.js"></script>
    <script src="../../js/erp-editor.js"></script>
</body>
</html>
