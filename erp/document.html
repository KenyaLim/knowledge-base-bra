<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuBase | Documentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="document">
    <div id="navbar"></div>
    <div class="app-layout">
        <aside id="sidebar"></aside>
        <main class="main-content">
            <section class="hero document-hero">
                <div class="hero-content">
                    <p id="documentModule" class="eyebrow">DOCUMENTATION</p>
                    <h1 id="documentTitle">Loading...</h1>
                    <p id="documentSummary" class="hero-description"></p>
                </div>
            </section>
            <section class="section">
                <article id="documentContent" class="document-content">Loading document...</article>
            </section>
        </main>
    </div>
    <script src="../js/navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="../js/document.js"></script>
</body>
</html>
