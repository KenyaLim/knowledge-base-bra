<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Manager</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body">
    <main class="admin-shell">
        <header class="admin-header">
            <div>
                <p class="eyebrow">KNOWLEDGE BASE</p>
                <h1>Content Manager</h1>
                <p>Kelola PDF dan gambar yang tampil di halaman knowledge base.</p>
            </div>
            <a class="content-action secondary" href="../index.html"><i class="ph ph-arrow-left"></i> Kembali</a>
        </header>

        <section class="admin-layout">
            <form class="admin-form" id="contentForm">
                <h2 id="formTitle">Tambah materi</h2>
                <input type="hidden" name="id" id="contentId">
                <label>Judul <input required name="title" id="contentTitle" maxlength="120"></label>
                <label>Modul
                    <select required name="category" id="contentCategory">
                        <option value="Getting Started">Getting Started</option>
                        <option value="Stage">Stage</option>
                        <option value="MRP">MRP</option>
                        <option value="Purchase">Purchase</option>
                        <option value="Inventory">Inventory</option>
                        <option value="Production">Production</option>
                        <option value="Shipment">Shipment</option>
                    </select>
                </label>
                <label>Jenis
                    <select required name="type" id="contentType">
                        <option value="pdf">PDF</option>
                        <option value="image">Gambar</option>
                    </select>
                </label>
                <label>File <input type="file" name="file" id="contentFile" accept="application/pdf,image/*"></label>
                <p class="admin-help">File wajib saat menambah materi. Saat edit, kosongkan jika file tidak diganti.</p>
                <div class="admin-form-actions">
                    <button class="content-action" type="submit"><i class="ph ph-cloud-arrow-up"></i> Simpan</button>
                    <button class="content-action secondary" type="button" id="cancelEdit" hidden>Batal edit</button>
                </div>
                <p class="admin-message" id="formMessage" role="status"></p>
            </form>

            <section>
                <div class="admin-list-heading">
                    <h2>Materi tersimpan</h2>
                    <button class="content-action secondary" type="button" id="refreshContent"><i class="ph ph-arrows-clockwise"></i> Refresh</button>
                </div>
                <div class="admin-items" id="adminItems"><p class="content-status">Memuat...</p></div>
            </section>
        </section>
    </main>
    <script src="admin.js"></script>
</body>
</html>
