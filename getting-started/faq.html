<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FAQ | Knowledge Base</title>

    <link rel="stylesheet" href="../css/style.css">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body data-page="faq">

    <div id="navbar"></div>

    <div class="app-layout">

        <aside id="sidebar"></aside>

        <main class="main-content">

            <section class="page-header">
                <p class="eyebrow">KNOWLEDGE BASE</p>

                <h1>Frequently Asked Questions</h1>

                <p>
                    Common questions and answers about the ERP system.
                </p>
            </section>


            <section class="faq-section">

                <div class="faq-item">

                    <button class="faq-question">
                        <span>What is the ERP system?</span>
                        <i class="ph ph-plus"></i>
                    </button>

                    <div class="faq-answer">
                        <p>
                            Input your answer here.
                        </p>
                    </div>

                </div>


                <div class="faq-item">

                    <button class="faq-question">
                        <span>How do I log in?</span>
                        <i class="ph ph-plus"></i>
                    </button>

                    <div class="faq-answer">
                        <p>
                            Input your answer here.
                        </p>
                    </div>

                </div>

            </section>


            <section class="faq-section">



                <div class="faq-item">

                    <button class="faq-question">
                        <span>What is Stage used for?</span>
                        <i class="ph ph-plus"></i>
                    </button>

                    <div class="faq-answer">
                        <p>
                            Input your answer here.
                        </p>
                    </div>

                </div>


                <div class="faq-item">

                    <button class="faq-question">
                        <span>How do I create an order?</span>
                        <i class="ph ph-plus"></i>
                    </button>

                    <div class="faq-answer">
                        <p>
                            Input your answer here.
                        </p>
                    </div>

                </div>

            </section>

            
        </main>

    </div>


    <script src="../js/navbar.js"></script>

    <script>

        document.querySelectorAll(".faq-question").forEach(button => {

            button.addEventListener("click", () => {

                const item = button.parentElement;

                item.classList.toggle("open");

            });

        });

    </script>

</body>
</html>
