<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ | Knowledge Base</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/faq.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body data-page="faq">
    <div id="navbar"></div>
    <div class="app-layout">
        <aside id="sidebar"></aside>
        <main class="main-content" id="faq-app">
            <section class="page-header">
                <p class="eyebrow">KNOWLEDGE BASE</p>
                <h1>Frequently Asked Questions</h1>
                <p>Temukan jawaban atas pertanyaan yang sering diajukan.</p>
            </section>
            <div class="faq-controls">
                <label for="faq-search"><i class="ph ph-magnifying-glass" aria-hidden="true"></i> Cari pertanyaan</label>
                <input id="faq-search" type="search" placeholder="Cari pertanyaan..." maxlength="300">
                <label for="faq-category">Kategori</label>
                <select id="faq-category"><option>Semua</option><option>STAGE</option><option>PROMAN</option><option>Umum</option></select>
            </div>
            <p id="faq-status" role="status" aria-live="polite">Memuat FAQ...</p>
            <button id="faq-retry" type="button" hidden>Coba lagi</button>
            <section id="faq-list" aria-label="Pertanyaan dan jawaban"></section>
        </main>
    </div>
    <script src="../js/navbar.js"></script>
    <script src="../js/faq.js"></script>
</body>
</html>
