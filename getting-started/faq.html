<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ | Knowledge Base</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/faq.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body data-page="faq">
    <div id="navbar"></div>
    <div class="app-layout">
        <aside id="sidebar"></aside>
        <main class="main-content" id="faq-app" data-full="true">
            <div class="faq-content">
            <section class="page-header">
                <h1><i class="ph ph-question" aria-hidden="true"></i> Pusat Bantuan &amp; FAQ</h1>
                <p>Temukan jawaban seputar penggunaan ERP.</p>
            </section>
            <div class="faq-search-panel">
                <div class="faq-search-field">
                    <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
                    <input id="faq-search" aria-label="Cari pertanyaan atau topik" type="search" placeholder="Cari pertanyaan atau topik..." maxlength="300">
                </div>
                <div class="faq-controls" id="faq-categories" role="group" aria-label="Kategori FAQ">
                    <button type="button" data-category="Semua" aria-pressed="true">Semua</button>
                    <button type="button" data-category="STAGE" aria-pressed="false">STAGE</button>
                    <button type="button" data-category="PROMAN" aria-pressed="false">PROMAN</button>
                    <button type="button" data-category="Umum" aria-pressed="false">Umum</button>
                </div>
                <div class="faq-tag-filter">
                    <label for="faq-tag">Filter tag</label><input id="faq-tag" list="faq-tag-options" placeholder="Semua tag" maxlength="40"><datalist id="faq-tag-options"></datalist>
                </div>
            </div>
            <div class="faq-list-panel">
                <p id="faq-status" role="status" aria-live="polite">Memuat FAQ...</p>
                <button id="faq-retry" type="button" hidden>Coba lagi</button>
                <section id="faq-list" aria-label="Pertanyaan dan jawaban"></section>
                <button id="faq-more" type="button" hidden>Muat lebih banyak</button>
            </div>
            </div>
        </main>
    </div>
    <script src="../js/navbar.js"></script>
    <script src="../js/faq.js"></script>
</body>
</html>
