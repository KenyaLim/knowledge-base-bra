<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Management | Knowledge Base</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin" class="admin-page">
    <div id="navbar"></div>
    <div class="app-layout">
        <aside id="sidebar"></aside>
        <main class="main-content">
            <header class="navigation-header">
                <h1>Navigation Management</h1>
                <p>Kelola modul dan halaman ERP</p>
                <a href="users.html">Manajemen Pengguna</a>
            </header>
            <section class="section navigation-management-section">
                <fieldset class="navigation-segments navigation-scope">
                    <legend class="navigation-visually-hidden">Area</legend>
                    <label><input type="radio" name="navigationScope" value="stage" checked><span>STAGE</span></label>
                    <label><input type="radio" name="navigationScope" value="proman"><span>PROMAN</span></label>
                </fieldset>
                <section class="cms-panel navigation-list-panel" aria-labelledby="navigationStructureHeading">
                    <h2 id="navigationStructureHeading">STAGE</h2>
                    <ul id="navigationList" aria-live="polite"></ul>
                </section>
                <form id="navigationForm" class="cms-panel cms-form navigation-form-panel">
                    <fieldset class="navigation-segments">
                        <legend class="navigation-visually-hidden">Tambah item</legend>
                        <label><input type="radio" name="navigationType" value="module" checked><span>+ Tambah Modul</span></label>
                        <label><input type="radio" name="navigationType" value="page"><span>+ Tambah Halaman</span></label>
                    </fieldset>
                    <input type="hidden" id="navigationId">
                    <label id="navigationParentField" hidden>Modul induk<select id="navigationParentId"></select></label>
                    <label><span id="navigationTitleLabel">Nama modul baru</span><input id="navigationTitle" required maxlength="200" autocomplete="off"></label>
                    <div class="cms-form-actions">
                        <button type="submit" id="saveNavigation" class="navbar-signin">Tambah</button>
                        <button type="button" id="newNavigation" class="cms-secondary-button" hidden>Batal</button>
                    </div>
                    <p id="navigationStatus" role="status" aria-live="polite"></p>
                </form>
            </section>
        </main>
    </div>
    <script src="js/navbar.js"></script>
    <script src="js/navigation-admin.js"></script>
</body>
</html>
