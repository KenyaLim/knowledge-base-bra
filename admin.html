<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin | Knowledge Base</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin">
    <div id="navbar"></div>
    <div class="app-layout">
        <aside id="sidebar"></aside>
        <main class="main-content">
            <section class="hero">
                <div class="hero-content">
                    <p class="eyebrow">CONTENT MANAGEMENT</p>
                    <h1>Materials</h1>
                    <p class="hero-description">Create, edit, publish, and attach PDF materials without changing the HTML pages.</p>
                </div>
            </section>
            <section class="section cms-admin-layout">
                <div class="cms-panel">
                    <div class="section-heading"><i class="ph ph-files"></i><h2>Saved materials</h2></div>
                    <div id="materialList" class="cms-material-list" aria-live="polite"></div>
                </div>
                <form id="materialForm" class="cms-panel cms-form">
                    <div class="section-heading"><i class="ph ph-pencil-simple"></i><h2>Edit material</h2></div>
                    <input type="hidden" id="materialId">
                    <label>Slug<input id="slug" required placeholder="mrp-material"></label>
                    <label>Title<input id="title" required placeholder="Material Requirement"></label>
                    <label>Module<select id="module" required>
                        <option value="order">Order</option>
                        <option value="mrp">MRP</option>
                        <option value="purchase">Purchase</option>
                        <option value="inventory">Inventory</option>
                        <option value="production">Production</option>
                        <option value="shipment">Shipment</option>
                    </select></label>
                    <input type="hidden" id="kind" value="detail">
                    <label>Summary<textarea id="summary" rows="2"></textarea></label>
                    <label>Content</label>
                    <div class="cms-editor" id="contentEditorShell">
                        <div class="cms-toolbar" role="toolbar" aria-label="Content formatting">
                            <button type="button" data-command="bold" title="Bold"><i class="ph ph-text-b"></i></button>
                            <button type="button" data-command="italic" title="Italic"><i class="ph ph-text-italic"></i></button>
                            <button type="button" data-command="underline" title="Underline"><i class="ph ph-text-underline"></i></button>
                            <button type="button" data-command="insertUnorderedList" title="Bullet list"><i class="ph ph-list-bullets"></i></button>
                            <button type="button" data-command="insertOrderedList" title="Numbered list"><i class="ph ph-list-numbers"></i></button>
                            <button type="button" data-block="h2" title="Heading">H2</button>
                            <button type="button" id="insertImage" title="Insert image"><i class="ph ph-image"></i></button>
                            <button type="button" id="insertVideo" title="Insert video"><i class="ph ph-video-camera"></i></button>
                            <button type="button" id="clearFormatting" title="Clear formatting"><i class="ph ph-eraser"></i></button>
                        </div>
                        <div id="contentEditor" class="cms-editor-input" contenteditable="true" data-placeholder="Tulis isi materi, langkah-langkah, dan penjelasan di sini..."></div>
                    </div>
                    <input id="content" type="hidden">
                    <input id="mediaUpload" type="file" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm" hidden>
                    <label>PDF URL<input id="pdfUrl" type="url" placeholder="https://.../materi.pdf"></label>
                    <label>Gambar URL<input id="imageUrl" type="url" placeholder="https://.../materi.jpg"></label>
                    <label>Upload PDF / gambar / video<input id="fileUpload" type="file" accept="application/pdf,image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm"></label>
                    <label>Urutan<input id="sortOrder" type="number" value="0"></label>
                    <label class="cms-checkbox"><input id="published" type="checkbox"> Published</label>
                    <div class="cms-form-actions">
                        <button type="button" id="newMaterial" class="cms-secondary-button">New</button>
                        <button type="button" id="deleteMaterial" class="cms-secondary-button" hidden>Delete</button>
                        <button type="submit" class="navbar-signin">Save material</button>
                    </div>
                    <p id="formStatus" class="search-status" aria-live="polite"></p>
                </form>
            </section>
            <section class="section cms-admin-layout">
                <div class="cms-panel cms-form">
                    <div class="section-heading"><i class="ph ph-sitemap"></i><h2>Module & child configuration</h2></div>
                    <p class="admin-help">Atur nama dan ikon modul, lalu kelola laman child yang muncul di sidebar. Semua perubahan akan terlihat setelah disimpan.</p>
                    <div id="moduleEditor" class="module-editor"></div>
                    <div class="cms-form-actions">
                        <button type="button" id="addModule" class="cms-secondary-button"><i class="ph ph-plus"></i> Add module</button>
                        <button type="button" id="saveModuleConfig" class="navbar-signin">Save module tree</button>
                    </div>
                    <p id="moduleConfigStatus" class="search-status" aria-live="polite"></p>
                </div>
            </section>
        </main>
    </div>
    <script src="js/navbar.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
