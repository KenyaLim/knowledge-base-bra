<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Admin | Knowledge Base</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin" class="admin-page">
    <div id="navbar"></div>
    <div class="app-layout">
        <aside id="sidebar"></aside>
        <main class="main-content">
            <section class="hero">
                <div class="hero-content">
                    <p class="eyebrow">NAVIGATION MANAGEMENT</p>
                    <h1>Navigation</h1>
                    <p class="hero-description">Kelola parent dan child navbar tanpa mengubah file HTML.</p>
                </div>
            </section>
            <section class="section cms-admin-layout">
                <div class="cms-panel navigation-list-panel">
                    <div class="section-heading"><i class="ph ph-list"></i><h2>Navigation structure</h2></div>
                    <p class="hero-description">Parent adalah kategori. Child adalah tautan ke halaman HTML.</p>
                    <div id="navigationList" class="cms-material-list" aria-live="polite"></div>
                </div>
                <form id="navigationForm" class="cms-panel cms-form navigation-form-panel">
                    <div class="section-heading"><i class="ph ph-pencil-simple"></i><h2>Add / edit item</h2></div>
                    <input type="hidden" id="navigationId">
                    <label>Judul<input id="navigationTitle" required></label>
                    <fieldset class="navigation-scope">
                        <legend>Area navbar</legend>
                        <label><input type="radio" name="navigationScope" value="stage" checked> STAGE</label>
                        <label><input type="radio" name="navigationScope" value="proman"> PROMAN</label>
                    </fieldset>
                    <label>Tipe<select id="navigationType"><option value="category">Kategori</option><option value="page">Laman HTML</option></select></label>
                    <label>Parent<select id="navigationParentId"><option value="">Tidak ada (root)</option></select></label>
                    <label>Icon Phosphor (opsional)<input id="navigationIcon" value=""></label>
                    <label>Page key<input id="navigationPage" placeholder="inventory-stock"></label>
                    <label>URL<input id="navigationUrl" placeholder="/api/cms/page/inventory-stock"></label>
                    <div id="navigationPageFields">
                        <label>Judul H1<input id="navigationH1" placeholder="Judul utama laman"></label>
                        <label>Ringkasan<textarea id="navigationSummary" rows="3"></textarea></label>
                        <label>Konten HTML<textarea id="navigationContent" rows="10" placeholder="Isi laman HTML"></textarea></label>
                    </div>
                    <label>Urutan<input id="navigationSortOrder" type="number" value="0"></label>
                    <label class="cms-checkbox"><input id="navigationPublished" type="checkbox" checked> Published</label>
                    <div class="cms-form-actions">
                        <button type="button" id="importNavigation" class="cms-secondary-button">Sync existing navbar</button>
                        <button type="button" id="createRootNavigation" class="cms-secondary-button">Create Root</button>
                        <button type="button" id="createModuleNavigation" class="cms-secondary-button">Create Module</button>
                        <button type="button" id="createPageNavigation" class="cms-secondary-button">Create Page</button>
                        <button type="button" id="newNavigation" class="cms-secondary-button">Clear</button>
                        <button type="button" id="deleteNavigation" class="cms-secondary-button" hidden>Delete</button>
                        <button type="submit" class="navbar-signin">Save</button>
                    </div>
                    <p id="navigationStatus" class="search-status" aria-live="polite"></p>
                </form>
            </section>
        </main>
    </div>
    <script src="js/navbar.js"></script>
    <script src="js/navigation-admin.js"></script>
</body>
</html>
