<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <main class="login-shell">
        <section class="login-card">
            <div class="login-brand">
                <span class="navbar-logo-icon">
                    <i class="ph ph-squares-four"></i>
                </span>
                <div>
                    <p class="eyebrow">KNOWLEDGE BASE</p>
                    <h1>Sign in</h1>
                </div>
            </div>

            <!-- <p class="login-copy">
                This documentation is private. Enter your username and password to continue.
            </p> -->

            <p id="loginError" class="login-error" hidden></p>

            <form class="login-form" method="POST" action="/api/login" autocomplete="on">
                <input type="hidden" name="next" id="nextField" value="/index.html">

                <label class="login-label" for="email">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    required
                    autocomplete="username"
                    spellcheck="false"
                >

                <label class="login-label" for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    autocomplete="current-password"
                >

                <button type="submit" class="login-submit">
                    Sign in
                    <i class="ph ph-arrow-right"></i>
                </button>
            </form>
        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const nextField = document.getElementById("nextField");
        const errorBox = document.getElementById("loginError");
        const next = params.get("next");
        const error = params.get("error");

        if (next && next.startsWith("/") && !next.startsWith("//")) {
            nextField.value = next;
        }

        if (error === "invalid") {
            errorBox.hidden = false;
            errorBox.textContent = "Email or password is incorrect.";
        }

        if (error === "config") {
            errorBox.hidden = false;
            errorBox.textContent = "Login is not configured. Set SUPABASE_URL, SUPABASE_ANON_KEY, and AUTH_SECRET in Vercel.";
        }
    </script>
</body>
</html>
