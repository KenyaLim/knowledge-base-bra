<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manajemen Pengguna</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="users" class="admin-page">
<div id="navbar"></div>
<div class="app-layout">
<aside id="sidebar"></aside>
<main class="main-content">
<h1>Manajemen Pengguna</h1>
<p>Akun manual tetap dikelola melalui konfigurasi server. Email tidak diperlukan.</p>
<p id="user-status" role="status"></p>
<p id="user-stats"></p>
<label>Cari pengguna <input id="user-search" type="search"></label>
<form id="user-form" class="cms-panel cms-form navigation-form-panel">
<input name="id" type="hidden">
<label>Username <input name="username" required minlength="3" maxlength="64"></label>
<label>Nama lengkap <input name="full_name" required maxlength="150"></label>
<label>Role <select name="role"><option value="user">Pengguna</option><option value="admin">Admin</option></select></label>
<label>Password <input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password"></label>
<p>Kosongkan password saat mengedit untuk mempertahankan password lama.</p>
<button type="submit">Simpan</button><button type="reset">Batal / Baru</button>
</form>
<table><thead><tr><th>Username</th><th>Nama</th><th>Role</th><th>Status</th><th>Tindakan</th></tr></thead><tbody id="user-list"></tbody></table>
</main>
</div>
<script src="js/navbar.js"></script>
<script src="js/users.js"></script>
</body>
</html>
